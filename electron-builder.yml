appId: com.vilelalab.bah
productName: Bah
afterPack: build/afterPack.js
# Assinatura VMP (Widevine/Netflix) roda AQUI, não no afterPack: o electron-builder edita
# o .exe (ícone/versão) depois do afterPack, e isso invalidava a assinatura.
afterSign: build/afterSign.js
# Usa o Electron que o npm JÁ baixou em node_modules, em vez de buscar no GitHub oficial.
# Obrigatório porque rodamos o fork da castLabs (44.5.1+wvcus, com Widevine pra Netflix):
# essa versão não existe em github.com/electron/electron, e sem isto o build morre em 404.
electronDist: node_modules/electron/dist
# Os módulos nativos (webtorrent, e o @napi-rs/canvas do pdf-parse) são N-API com binários
# pré-compilados que carregam sob o Electron 44 sem recompilar (ABI-estável). NÃO recompilar: evita exigir Visual
# Studio/node-gyp no build. Seguro porque o resto das deps pesadas do Bah é WASM (sem .node).
npmRebuild: false
publish:
  provider: github
  owner: alexvilelabah
  repo: bah-browser
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
  # Roteador local (node-llama-cpp): sem os binários CUDA (centenas de MB; Vulkan cobre a GPU no
  # Windows/Linux, Metal no Mac, e sempre há CPU), sem o código-fonte do llama.cpp (só serve pra
  # compilar, e o app usa build:'never') e sem os templates do CLI.
  - "!node_modules/@node-llama-cpp/*-cuda*/**"
  - "!node_modules/node-llama-cpp/llama/gitRelease.bundle"
  - "!node_modules/node-llama-cpp/templates/**"
# Ícone acessível em runtime (bandeja do sistema) — o exe embute o ícone, mas o Tray
# precisa de um arquivo em disco. Vai pra resources/ no app empacotado. tray.png é o logo já
# desenhado em 32 px (fica mais nítido que encolher o PNG de 1024 na hora).
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: build/tray.png
    to: tray.png
  # OCR offline: sem isso o tesseract.js baixa do CDN na primeira OCR. langPath aponta pra ca.
  - from: eng.traineddata
    to: tessdata/eng.traineddata
  - from: por.traineddata
    to: tessdata/por.traineddata
# Desempacota o WASM (motor de voz local) — o onnxruntime nao carrega WASM de dentro do asar.
asarUnpack:
  - "**/*.wasm"
  # Motor de torrent: ESM forkado num utilityProcess + módulos NATIVOS (.node) do webtorrent.
  # ESM/.node não carregam de dentro do asar → têm que ficar em app.asar.unpacked.
  - "dist/main/torrent/engine.mjs"
  # Download do agente: worker thread (+ o módulo que ele importa) roda do disco, fora do asar.
  - "dist/main/agent-download-worker.js"
  - "dist/main/download-progress.js"
  - "node_modules/node-datachannel/**"
  - "node_modules/utp-native/**"
  - "node_modules/bufferutil/**"
  - "node_modules/utf-8-validate/**"
  - "node_modules/fs-native-extensions/**"
  # Roteador local: os binários nativos do llama.cpp (.node + .dylib/.dll/.so, carregados por dlopen)
  # têm que estar no disco. O JS do node-llama-cpp e o motor (dist/main/router/engine.mjs) ficam NO
  # asar: o node-llama-cpp acha os binários em app.asar.unpacked sozinho, e as ~120 dependências
  # dele só resolvem de dentro do asar (desempacotar o pacote sem elas quebraria o import).
  - "node_modules/@node-llama-cpp/**"
  - "node_modules/node-llama-cpp/bins/**"
  - "node_modules/node-llama-cpp/llama/localBuilds/**"
win:
  target:
    - nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Sem espaços no nome → o GitHub não troca por pontos e o nome bate com o latest.yml
  # (essencial pro auto-update achar o arquivo).
  artifactName: ${productName}-Setup-${version}.${ext}
mac:
  target:
    - dmg
  icon: build/icon.png
  # Electron 44 não roda mais no macOS 12 (Monterey).
  minimumSystemVersion: "13.0"
  # Navegador padrão (⋮ → Navegador padrão): o macOS só lista como navegador o app que declara os
  # links http/https e as páginas .html. Só no Mac — no Windows quem registra é o próprio Bah, no
  # clique (nada de associação de arquivo no instalador NSIS).
  protocols:
    - name: Web
      schemes: [http, https]
      role: Viewer
  fileAssociations:
    - ext: [html, htm, xhtml]
      name: HTML Document
      role: Viewer
# Arquitetura SEMPRE no nome (o padrão do electron-builder omite o "x64"), pra Apple Silicon
# e Intel não colidirem quando os dois .dmg sobem pra mesma release.
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
  icon: build/icon.png
