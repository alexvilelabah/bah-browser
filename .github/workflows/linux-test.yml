name: Linux build + smoke test

# Roda nos servidores Linux (Ubuntu) gratuitos do GitHub.
# Objetivo: confirmar que o Bah ABRE e não crasha no Linux (smoke test headless),
# e gerar um AppImage como artefato. NÃO testa download de mídia (código Windows).

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar o AppImage como pre-release EXPERIMENTAL (Linux x64)'
        type: boolean
        default: true
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'assets/**'
      - 'LICENSE'

permissions:
  contents: write   # pro passo de publicar a pre-release (só no dispatch manual)

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # O Electron aqui é o fork da castLabs (Widevine/DRM), que vem do GitHub, e o
      # package-lock grava a URL como git+ssh://. O runner não tem chave SSH pro GitHub,
      # então sem esta reescrita o npm ci morre em "Permission denied (publickey)".
      - name: Buscar dependências de git via HTTPS (não SSH)
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Instalar dependências do projeto
        run: npm ci || npm install

      - name: Libs de sistema do Linux (GUI + xvfb + keytar)
        run: |
          sudo apt-get update
          sudo npx --yes playwright install-deps || true
          sudo apt-get install -y xvfb libsecret-1-0 || true

      - name: Build (renderer + main)
        run: npm run build

      - name: Recompilar módulos nativos para o Electron
        run: npx --yes @electron/rebuild -f || true

      - name: Smoke test (abre headless e confirma que não crasha)
        run: |
          set -e
          xvfb-run -a --server-args="-screen 0 1280x1024x24" bash -c '
            npx electron . --no-sandbox --disable-gpu --disable-dev-shm-usage > app.log 2>&1 &
            APP=$!
            sleep 15
            if kill -0 "$APP" 2>/dev/null; then
              echo "PASS: Bah continua rodando depois de 15s (abriu sem crashar no Linux)"
              kill "$APP" 2>/dev/null || true
              exit 0
            else
              echo "FAIL: o app saiu cedo demais (possivel crash no Linux)"
              exit 1
            fi
          '

      - name: Log do app (sempre)
        if: always()
        run: cat app.log 2>/dev/null || echo "(sem log)"

      # Sem continue-on-error: se o AppImage não sair, o run tem que FALHAR alto.
      # (antes ele engolia o erro e o passo de publicar quebrava com "no matches found")
      - name: Gerar AppImage
        run: npx --yes electron-builder --linux AppImage --publish never

      - name: Subir o AppImage como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bah-linux-appimage
          path: release/*.AppImage
          if-no-files-found: ignore

      # Publica SÓ no dispatch manual com publish=true. Tag própria (v*-linux-test) e
      # --prerelease: nunca vira "Latest" e NÃO toca o latest.yml do auto-update do Windows.
      - name: Publicar pre-release Linux (EXPERIMENTAL)
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VER=$(node -p "require('./package.json').version")
          TAG="v${VER}-linux-test"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" release/*.AppImage \
            --title "Bah ${VER} — Linux (EXPERIMENTAL · testers only)" \
            --prerelease \
            --notes-file .github/linux-test-notes.md
          gh release view "$TAG" --json isPrerelease,assets --jq '{isPrerelease,assets:[.assets[].name]}'
