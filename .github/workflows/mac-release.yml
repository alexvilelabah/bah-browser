name: macOS release (.dmg)

# Anexa o .dmg do macOS (Apple Silicon E Intel) em cada release publicada — a mesma
# release do instalador do Windows. Sem assinatura/notarização da Apple (ver o README:
# `xattr -cr /Applications/Bah.app` na 1ª abertura).
#
# Não mexe no auto-update: só sobem os .dmg (sem latest-mac.yml), e o app não procura
# atualização no macOS (setupAutoUpdater sai cedo fora do Windows).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release que recebe os .dmg (ex.: v1.8.12 — tags antigas não têm o suporte a Mac)'
        required: true

permissions:
  contents: write   # gh release upload

jobs:
  dmg:
    # As pre-releases de teste (v*-macos-test / v*-linux-test) têm fluxo próprio.
    if: github.event_name == 'workflow_dispatch' || !endsWith(github.event.release.tag_name, '-test')
    strategy:
      fail-fast: false
      matrix:
        include:
          # O electronDist do electron-builder.yml usa o Electron (castLabs) que o npm
          # baixou → cada arquitetura compila no Mac da própria arquitetura.
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Checkout (na tag da release)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          # O token NÃO fica gravado no .git/config enquanto os scripts de instalação do npm
          # rodam (passo seguinte) — um pacote ruim não acha ele ali pra mexer na release.
          persist-credentials: false

      # Tag de antes do suporte a Mac (v1.8.11 ou anterior) geraria um .dmg sem os consertos
      # de Mac e com o nome errado — para aqui em vez de anexar isso na release.
      - name: A tag tem o suporte a Mac?
        run: |
          test -f .github/workflows/mac-release.yml || { echo "A tag $TAG é de antes do suporte a Mac — use uma tag mais nova."; exit 1; }

      # Node 22: o Electron da castLabs, o @electron/get e o @electron/fuses pedem Node >= 22.12
      # (no Node 20 só passavam com aviso).
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Mesmo motivo do mac-test.yml: o package-lock aponta o Electron da castLabs via git+ssh.
      - name: Buscar dependências de git via HTTPS (não SSH)
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Instalar dependências do projeto
        run: npm ci || npm install

      # O pacote do Electron (castLabs 42) não baixa o binário na instalação: só no 1º uso.
      # Sem isso o electron-builder acha a pasta vazia ("corrupted Electron dist") — o
      # mac-test.yml só passava porque o smoke test (`npx electron .`) baixava antes.
      # Até 3 tentativas: na v1.8.13 o runner Intel deu "fetch failed" (rede) logo aqui.
      - name: Baixar o Electron (castLabs)
        run: |
          for i in 1 2 3; do
            node node_modules/electron/install.js && break
            echo "Falhou (tentativa $i) — tentando de novo em 15 s"; sleep 15
          done
          test -d node_modules/electron/dist/Electron.app

      - name: Build (renderer + main)
        run: npm run build

      - name: Gerar .dmg (${{ matrix.arch }})
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # sem certificado da Apple: não procurar
        run: npx --yes electron-builder --mac dmg --${{ matrix.arch }} --publish never

      - name: Anexar o .dmg na release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ls -l release/*.dmg
          gh release upload "$TAG" release/*.dmg --clobber --repo "$GITHUB_REPOSITORY"
